<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>LLM Security Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <h1>🛡️ GenAI Security Gateway</h1>
    <p class="subtitle">Admin Dashboard</p>
    
    <div>
        <div class="card blue">
            <div class="stat">{{ stats.total_requests }}</div>
            <div class="label">Total Requests</div>
        </div>
        <div class="card red">
            <div class="stat">{{ stats.blocked_injections }}</div>
            <div class="label">Prompt Injections blocked</div>
        </div>
        <div class="card orange">
            <div class="stat">{{ stats.data_leaks_prevented }}</div>
            <div class="label">Data Loss Prevention</div>
        </div>
    </div>
</body>
</html>
